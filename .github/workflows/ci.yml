name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 配额保护（2026-09-25 实测：私有仓免费额度 2000 分/月被 8-job×3-OS 矩阵几天烧尽，
# 136 个 run 0 绿——后续 run 全部 startup_failure）。同一分支新推送自动取消未完成的旧 run，
# 消除「文档改动也全矩阵重跑」的浪费；额度彻底耗尽仍需开通计费或转公开仓库（用户决策）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 铁律自检 + 类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      # actions 全部钉定完整 SHA（仓库 Actions 纪律 sha_pinning_required=true：tag 引用一律
      # startup_failure——2026-09-25 排障实证，这也是「136 run 0 绿」的最终根因之一）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      # 仅含 devDependencies（@types/node, typescript），零运行时依赖。
      - run: npm install
      # 阻断级铁律：零运行时依赖 / 禁止第三方裸导入 / TS 文件名 camelCase。
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      # 工程化门禁：ESLint 零告警（--max-warnings=0）。
      # 2026-09-16 收紧：静态告警曾编码两处真实断链（附件漏传、query 死参数），
      # 故告警预算归零——任何新增 warn 一律阻断，防止告警池再次沦为噪声。
      - run: npm run lint
      # 公开 API 稳定性契约：每项 export 必须落在带 @public/@beta/@deprecated 标注的分区内。
      - run: npm run api:check
      # T0 成熟度治理门禁（docs/TECH_DIRECTION_SYNTHESIS_2026-09-12.md）：
      # 以物理/生物/化学命名的引擎必须声明 L0–L3 等级，声称 L2/L3 须给出真实测试证据。
      # 防止「命名好听」被当作「有机制」——无测试的 L3 声明即阻断。
      - run: npm run audit:maturity
      # P0.3 规范度量审计（报告级起步，REFACTOR_BOARD §P0.3）：audit:standard 出规范总表
      # （var/any、JSDoc、上帝类、文件名=类名…），audit:metrics 出 P0.2 四类细粒度度量
      # （@param/@returns/字段注释覆盖、core→adapters、模块级 new 清单）。两脚本当前均 exit 0，
      # 数字进 CI 日志可见趋势；阻断由 pre-commit 的 --delta 增量门禁承担。
      - run: npm run audit:standard
      - run: npm run audit:metrics
      # 接线完整性门禁：把本仓最高频缺陷形态「声明未接线」机器化——`OmniHarnessConfig` 的每个
      # 字段必须真的沿「声明 → 装配 → 运行时 → 消费」四段走通；配置键不得为幽灵键；CLI 旗标
      # 不得只解析不使用。八批同型（D2/D3/D4/F3/F5/E3/E2/P5）曾反复以「可选字段被对象字面量
      # 静默丢弃、TS 不报错」的形式逃过全部类型检查，故单列一关。
      - run: npm run audit:config-wiring
      # P0.4 + P1.4 架构门禁（REFACTOR_BOARD §P0.4/§P1.4）：core↔adapters 双向依赖、ports 纯度。
      # P1 清偿后白名单已清空（实测 0/0），--strict 升为全阻断：任何依赖方向违规（含存量）即判红，
      # 目录平铺告警保持非阻断（待 P3 清偿）。防止架构回归。
      - run: npm run arch:gate -- --strict

  web:
    name: Web UI 构建 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      # 此前 web 零门禁：7 处 window.alert 无人管、2 个 a11y 标记、命令面板 / 回滚 / 增量流式
      # 等新功能全靠本地肉眼 review。现把 web 类型检查 + 单测纳入红线，回归即红。
      - run: npm run web:build
      - run: npm run web:test
      # 浏览器存在性**显式断言**：`web:test` 里的 e2e-cdp 与 test 作业里的「真 serve + 真 SPA + 结构基线」
      # 都设计成「无浏览器则 skip」（本机开发友好）。但 CI 上不能让它静默跳过——否则这些门禁会**看着绿、
      # 实际没跑**（假绿）。这一步就是防它降级：runner 无浏览器即红，并打印找过的候选路径。
      - name: 断言 CI 环境确有浏览器（否则浏览器类门禁会静默 skip）
        run: |
          node -e "import('./web/test/browserHarness.mjs').then((m)=>{const b=m.findBrowser();if(!b){console.error('CI 缺浏览器：浏览器类门禁（e2e-cdp / 真机 UI 体检 / 结构基线 / 响应式探针）将静默跳过');process.exit(1);}console.log('browser =',b);})"
      # 响应式探针（真 Chrome + CDP，量 640/1280 有无横向溢出）此前只在本地手跑 ⇒ 收进 CI。
      - name: 窄窗/中窗横向溢出探针（真 Chrome）
        run: node web/test/responsiveProbe.mjs

  test:
    name: 单元测试（含覆盖率门禁 · 跨平台真机）
    # B3 更优解：用 GitHub 托管 runner 矩阵直接验证 Linux/macOS/Windows 真机，
    # 替代「自购/自管 Linux·macOS 真机」方案——保真度一致（真实内核）、效率更高
    # （零硬件筹备）、零外部依赖。fail-fast:false 让三平台各自独立报红。
    runs-on: ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      # 构建前端 bundle：test:integration 的「真 serve + 真 SPA + 真 Chrome」serve 的是
      # web/dist——本 job 不跑 web:build 的话，index.html 有 #root 却没有 bundle，
      # composer 永不出现（windows runner 首跑实证：waitMounted 800 次轮询超时）。
      - run: npm run web:build
      # 原生内核（.node）在 CI 环境未构建，相关用例会自动 skip；其余用例真实执行。
      # coverage:check = 构建 + 全量测试 + Node 内置覆盖率 + 行覆盖率阈值门禁（零依赖）。
      - run: npm run coverage:check
      # 集成/端到端分层：多模块真实 IO 编排（agent→门禁→存储→检查点→权限），独立于单元测试。
      # `OMNI_REQUIRE_BROWSER=1`：其中「真 serve + 真 SPA + 真 Chrome + 结构基线」一例在无浏览器时
      # 本会 skip ⇒ 那等于这条门禁看着绿却没跑。三平台 runner 均自带 Chrome，故 CI 下把 skip 升级为失败。
      - run: npm run test:integration
        env:
          OMNI_REQUIRE_BROWSER: '1'

  eval:
    name: 零key eval 门禁（SWE replay + Pass@k）
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      # U5 规模化门禁：passK 单测 + SWE 本地子集 ScriptedModel replay（零 key、不联网、不付费）
      # + Pass@k 阈值门禁（--repeat 5 --min-pass-k 3,0.9）。回退即红，防止跑分能力静默劣化。
      - run: npm run eval:ci
      # T2 排序否决器回溯门禁：否决器必须能复盘已知失败（稠密图 −6.1pp / 稀疏图 −2.6pp）
      # 且对已知有效的 BM25 不误杀。--gate 只校验回溯一致率，新候选裁决不锁 CI。
      - run: npm run eval:veto

  security:
    name: 安全左移（依赖 CVE + secrets + 格式）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks 需完整历史才能扫描历史提交里的凭据。
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      # 依赖漏洞门禁：运行时依赖为零，此举守住 devDependencies 供应链（构建期同样可被投毒）。
      # 只阻断 high/critical，避免中低危噪声淹没信号导致门禁被习惯性忽略。
      - name: 依赖漏洞扫描（npm audit）
        run: npm audit --audit-level=high
      # 格式门禁：此前 prettier 只在 pre-commit 钩子里跑，CI 从未校验，
      # 未装钩子的贡献者提交的代码格式漂移无人拦截。
      - name: 格式校验
        run: npm run format:check
      # secrets 检测：凭据一旦进入仓库历史即为永久泄露，必须在 PR 阶段就拦下。
      # 2026-09-25 改为免费 CLI 直装：gitleaks-action 在私有仓必须 GITLEAKS_LICENSE（付费），
      # 没有 license 则本 job 恒红——CI 因此从未绿过（136 run 0 绿的根因之一）。CLI 版零许可要求，
      # 扫描语义不变（全历史 + --redact），命中即非零退出阻断；本地 pre-commit 另有 check:secrets 双保险。
      - name: secrets 扫描（gitleaks CLI，私有仓免许可口径）
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact

  rust:
    name: Rust 门禁（fmt + clippy + test）
    runs-on: ubuntu-latest
    # crates.io 从 runner 偶发「transfer too slow」（WASM job 首跑实证，重试 3 次仍失败即红）。
    env:
      CARGO_NET_RETRY: '5'
      CARGO_HTTP_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Rust 此前零门禁：本 job 补上 fmt/clippy/test 三道关卡。
      # 2026-09-25 去 action 化：dtolnay/rust-toolchain 为第三方 action（供应链面），
      # runner 预装 rustup + stable 工具链，补齐组件即可——零第三方依赖。
      - name: rustup 组件（fmt + clippy）
        run: rustup component add rustfmt clippy
      # 格式统一校验（零依赖铁律下的代码一致性）。
      - run: cargo fmt --all -- --check
      # 静态分析：警告即阻断，杜绝「未检查就合并」。
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 真实编译 + 全量单测（含 Windows-only 后端在 ubuntu 下走 cfg 降级分支）。
      - run: cargo test --workspace

  e2e:
    name: 端到端（smoke + stress）
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      # smoke/stress 此前游离主门禁，CI 红线碰不到；现独立 job 强制跑。
      - run: npm run smoke
      - run: npm run stress

  wasm:
    name: WASM 构建 + E2E
    runs-on: ubuntu-latest
    needs: gate
    # 同 rust job：crates.io 偶发慢传输，加重试与超时预算（首跑实测抖动即红）。
    env:
      CARGO_NET_RETRY: '5'
      CARGO_HTTP_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 去 action 化（同 rust job）：runner 预装 rustup，直接补 wasm32 target。
      - name: rustup target（wasm32）
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      # omni-wasm 内核构建 + wasm E2E（此前未进主门禁）。
      - run: npm run wasm:test
