<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OmniHarness 架构图</title>
<style>
  :root {
    --bg:#f6f8fb; --frame:#eef2f8; --card:#ffffff; --border:#d4dae4;
    --fg:#1c2330; --muted:#6b7280; --accent:#3b6ef5; --accent-soft:#eaf1ff;
    --hex:#eef5ff; --hexstroke:#3b6ef5; --warn:#c2562b;
  }
  [data-theme="dark"] {
    --bg:#0f1420; --frame:#171f31; --card:#19223a; --border:#2a3654;
    --fg:#e7ecf6; --muted:#94a1ba; --accent:#5b8dff; --accent-soft:#1b2c4f;
    --hex:#16233f; --hexstroke:#5b8dff; --warn:#e08a5a;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 20px; border-bottom:1px solid var(--border); }
  h1 { font-size:17px; margin:0; font-weight:700; }
  button { background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .wrap { padding:12px 16px 28px; display:flex; justify-content:center; }
  svg { max-width:100%; height:auto; }
  .frame { fill:var(--frame); stroke:var(--border); stroke-width:1.4; stroke-dasharray:5 4; rx:14; }
  .card { fill:var(--card); stroke:var(--border); stroke-width:1.4; }
  .card.accent { fill:var(--accent-soft); stroke:var(--accent); }
  .hex { fill:var(--hex); stroke:var(--hexstroke); stroke-width:1.3; }
  .title { font-size:18px; font-weight:700; fill:var(--fg); }
  .frame-title { font-size:13px; font-weight:700; fill:var(--accent); }
  .label { font-size:12.5px; font-weight:600; fill:var(--fg); }
  .small { font-size:10.5px; fill:var(--muted); }
  .tiny { font-size:9.5px; fill:var(--muted); }
  .warn { fill:var(--warn); }
</style>
</head>
<body data-theme="light">
<header>
  <h1>OmniHarness 架构：六边形端口-适配器 + TS 插件层 + Rust 内核</h1>
  <button id="theme">切换暗/亮主题</button>
</header>
<div class="wrap">
<svg viewBox="0 0 760 1080" xmlns="http://www.w3.org/2000/svg">

  <!-- 接入层 -->
  <g>
    <text class="frame-title" x="24" y="40">接入层</text>
    <rect class="card" x="24"  y="50" width="116" height="56" rx="9"/>
    <text class="label" x="82"  y="76" text-anchor="middle">Web UI</text>
    <text class="tiny"  x="82"  y="92" text-anchor="middle">零依赖三栏</text>
    <rect class="card" x="148" y="50" width="116" height="56" rx="9"/>
    <text class="label" x="206" y="76" text-anchor="middle">CLI</text>
    <text class="tiny"  x="206" y="92" text-anchor="middle">位置参数 prompt</text>
    <rect class="card" x="272" y="50" width="116" height="56" rx="9"/>
    <text class="label" x="330" y="76" text-anchor="middle">TS SDK</text>
    <text class="tiny"  x="330" y="92" text-anchor="middle">client</text>
    <rect class="card" x="396" y="50" width="116" height="56" rx="9"/>
    <text class="label" x="454" y="76" text-anchor="middle">Python SDK</text>
    <text class="tiny"  x="454" y="92" text-anchor="middle">client</text>
    <rect class="card" x="520" y="50" width="116" height="56" rx="9"/>
    <text class="label" x="578" y="76" text-anchor="middle">Rust SDK</text>
    <text class="tiny"  x="578" y="92" text-anchor="middle">Transport</text>
    <rect class="card" x="644" y="50" width="92"  height="56" rx="9"/>
    <text class="label" x="690" y="76" text-anchor="middle">MCP</text>
    <text class="tiny"  x="690" y="92" text-anchor="middle">网关</text>
  </g>

  <!-- TS 插件层外框 -->
  <rect class="frame" x="16" y="122" width="728" height="606" rx="14"/>
  <text class="frame-title" x="28" y="146">TS 插件层（生态与灵活性 · 零运行时依赖）</text>

  <!-- core -->
  <rect class="card" x="28" y="160" width="206" height="220" rx="10"/>
  <text class="label" x="40" y="182">core（稳定内核）</text>
  <text class="small" x="40" y="206">Agent</text>
  <text class="small" x="52" y="224">→ TurnRunner</text>
  <text class="small" x="52" y="242">→ StepRunner</text>
  <line x1="40" y1="258" x2="222" y2="258" stroke="var(--border)"/>
  <text class="small" x="40" y="280">工具执行链：</text>
  <text class="small" x="40" y="300">审批 → 沙箱 → 执行</text>
  <text class="small" x="40" y="318">→ 记录（fail-closed）</text>
  <text class="small" x="40" y="344">compaction · spill</text>
  <text class="small" x="40" y="362">subagent · goal · workflow</text>

  <!-- ports 六边形簇 -->
  <rect class="card" x="250" y="160" width="246" height="220" rx="10"/>
  <text class="label" x="262" y="182">ports（端口，只认接口）</text>
  <!-- 4 列 x 3 行 端口块 -->
  <g class="hex" >
    <rect x="262" y="194" width="54" height="30" rx="6"/><rect x="324" y="194" width="54" height="30" rx="6"/>
    <rect x="386" y="194" width="54" height="30" rx="6"/><rect x="448" y="194" width="40" height="30" rx="6"/>
    <rect x="262" y="232" width="54" height="30" rx="6"/><rect x="324" y="232" width="54" height="30" rx="6"/>
    <rect x="386" y="232" width="54" height="30" rx="6"/><rect x="448" y="232" width="40" height="30" rx="6"/>
    <rect x="262" y="270" width="54" height="30" rx="6"/><rect x="324" y="270" width="54" height="30" rx="6"/>
    <rect x="386" y="270" width="54" height="30" rx="6"/><rect x="448" y="270" width="40" height="30" rx="6"/>
  </g>
  <text class="tiny" x="289" y="213" text-anchor="middle">Model</text>
  <text class="tiny" x="351" y="213" text-anchor="middle">Tool</text>
  <text class="tiny" x="413" y="213" text-anchor="middle">Storage</text>
  <text class="tiny" x="468" y="213" text-anchor="middle">Event</text>
  <text class="tiny" x="289" y="251" text-anchor="middle">Sandbox</text>
  <text class="tiny" x="351" y="251" text-anchor="middle">Approval</text>
  <text class="tiny" x="413" y="251" text-anchor="middle">KV</text>
  <text class="tiny" x="468" y="251" text-anchor="middle">Vault</text>
  <text class="tiny" x="289" y="289" text-anchor="middle">Memory</text>
  <text class="tiny" x="351" y="289" text-anchor="middle">Graph</text>
  <text class="tiny" x="413" y="289" text-anchor="middle">Profile</text>
  <text class="tiny" x="468" y="289" text-anchor="middle">Escal.</text>
  <text class="small" x="262" y="320">+ 扩展端口：长期记忆 / 编排 / 配置集</text>
  <text class="small" x="262" y="342">+ LspPort · TodoPort · PlanPort</text>

  <!-- adapters -->
  <rect class="card accent" x="508" y="160" width="220" height="220" rx="10"/>
  <text class="label" x="520" y="182">adapters（适配器）</text>
  <text class="tiny" x="520" y="202">model:    mock / openai / anthropic / responses</text>
  <text class="tiny" x="520" y="220">storage:  memory / jsonl / sqlite</text>
  <text class="tiny" x="520" y="238">sandbox:  passthrough / policy / restricted</text>
  <text class="tiny" x="520" y="256">approval: auto / deny / rules / guardian</text>
  <text class="tiny" x="520" y="274">vault:    crypto(AES) / env</text>
  <text class="tiny" x="520" y="292">mcp / skills / plugin / lsp / sdk-server</text>
  <text class="tiny" x="520" y="310">检索: BM25 工具 / BM25 会话</text>
  <text class="tiny" x="520" y="328">native: 手写 N-API FFI（零依赖）</text>
  <text class="tiny" x="520" y="346">TUI: 零依赖富终端（#S35）</text>

  <!-- server / plugin / config -->
  <rect class="card" x="28" y="396" width="700" height="318" rx="10"/>
  <text class="label" x="40" y="418">server · plugin · config</text>

  <rect class="card" x="40" y="430" width="320" height="120" rx="9"/>
  <text class="small" x="52" y="452">app-server（JSON-RPC 2.0 + SSE）</text>
  <text class="tiny" x="52" y="472">/rpc: config · fs · plugins · memory</text>
  <text class="tiny" x="52" y="488">      graph · profile · bundle · threads</text>
  <text class="tiny" x="52" y="504">/events: thread · approval · memory.changed</text>
  <text class="tiny" x="52" y="520">/metrics: token / 成本 / 步数</text>
  <text class="tiny" x="52" y="538">transport: stdio / HTTP / WebSocket</text>

  <rect class="card" x="376" y="430" width="338" height="120" rx="9"/>
  <text class="small" x="388" y="452">plugin system</text>
  <text class="tiny" x="388" y="472">registry: 本地 / 内置 / 文件 / 远程</text>
  <text class="tiny" x="388" y="488">permission: 10 项白名单 + 危险高亮</text>
  <text class="tiny" x="388" y="504">loader: 运行时热加载闭环</text>
  <text class="tiny" x="388" y="520">bundle/profile: 发布 + 命名组合</text>
  <text class="tiny" x="388" y="538">sandbox: node:vm 受限上下文</text>

  <rect class="card" x="40" y="566" width="674" height="128" rx="9"/>
  <text class="small" x="52" y="588">config 分层（#G6，对标 codex）</text>
  <text class="tiny" x="52" y="608">四层合并：用户级 → 项目级 → profile → env</text>
  <text class="tiny" x="52" y="626">严格校验 fail-closed：未知 key / 类型 / 枚举越界 → 拒绝</text>
  <text class="tiny" x="52" y="644">别名归一（model_adapter / model-adapter → modelAdapter）</text>
  <text class="tiny" x="52" y="662">落盘仅 PERSISTABLE_KEYS 白名单（防凭据/工作区泄露）</text>
  <text class="tiny" x="52" y="682">CLI: --plugin-profile · --memory-encrypt · init-config 脚手架</text>

  <!-- 边界层 -->
  <g>
    <text class="frame-title" x="24" y="752">边界</text>
    <rect class="card" x="24"  y="762" width="232" height="58" rx="9"/>
    <text class="label" x="140" y="786" text-anchor="middle">stdio / TCP</text>
    <text class="tiny"  x="140" y="804" text-anchor="middle">JSON-RPC 2.0 · 一行一帧</text>
    <rect class="card" x="264" y="762" width="232" height="58" rx="9"/>
    <text class="label" x="380" y="786" text-anchor="middle">wasm</text>
    <text class="tiny"  x="380" y="804" text-anchor="middle">C ABI + JSON-RPC</text>
    <rect class="card" x="504" y="762" width="232" height="58" rx="9"/>
    <text class="label" x="620" y="786" text-anchor="middle">napi</text>
    <text class="tiny"  x="620" y="804" text-anchor="middle">in-process 手写 N-API</text>
  </g>

  <!-- Rust 内核 -->
  <rect class="frame" x="16" y="836" width="728" height="200" rx="14"/>
  <text class="frame-title" x="28" y="860">Rust 硬内核（性能与边界 · 仅 serde/serde_json 依赖）</text>
  <g>
    <rect class="card accent" x="28"  y="876" width="220" height="74" rx="10"/>
    <text class="label" x="138" y="902" text-anchor="middle">omni-core</text>
    <text class="tiny"  x="138" y="922" text-anchor="middle">AgentLoop · SQ/EQ</text>
    <text class="tiny"  x="138" y="940" text-anchor="middle">压缩 · 审批 · 沙箱 · 多Agent</text>

    <rect class="card" x="264" y="876" width="114" height="74" rx="10"/>
    <text class="label" x="321" y="916" text-anchor="middle">omni-wasm</text>
    <text class="tiny"  x="321" y="936" text-anchor="middle">cdylib</text>

    <rect class="card" x="392" y="876" width="114" height="74" rx="10"/>
    <text class="label" x="449" y="916" text-anchor="middle">omni-napi</text>
    <text class="tiny"  x="449" y="936" text-anchor="middle">FFI 插件</text>

    <rect class="card" x="520" y="876" width="114" height="74" rx="10"/>
    <text class="label" x="577" y="916" text-anchor="middle">omni-sdk</text>
    <text class="tiny"  x="577" y="936" text-anchor="middle">Transport</text>

    <rect class="card" x="648" y="876" width="84"  height="74" rx="10"/>
    <text class="label" x="690" y="916" text-anchor="middle">omni-cli</text>

    <rect class="card" x="28"  y="962" width="220" height="62" rx="10"/>
    <text class="label" x="138" y="998" text-anchor="middle">RestrictedToken</text>
    <text class="tiny"  x="138" y="1016" text-anchor="middle">Windows OS 级沙箱</text>

    <rect class="card" x="264" y="962" width="468" height="62" rx="10"/>
    <text class="small" x="276" y="988">omni-sdk-gen：单源 schema → Rust 服务端类型</text>
    <text class="tiny"  x="276" y="1008">平台沙箱占位：landlock / seatbelt / bwrap（fail-closed）</text>
  </g>

  <text class="tiny" x="16" y="1058">铁律：零运行时依赖 · 一功能一类 · 禁大函数 · 定制 = 实现端口 → 注入配置（不修改核心）。详见 docs/architecture.md。</text>
</svg>
</div>
<script>
  const b = document.getElementById('theme');
  b.addEventListener('click', () => {
    const cur = document.body.getAttribute('data-theme');
    document.body.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });
</script>
</body>
</html>
