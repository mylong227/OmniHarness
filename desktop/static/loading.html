<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniHarness</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fdfcf9;
        --muted: #a9a39a;
        --bg: #16181d;
        --accent: #6f7bd8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 600px at 50% 20%, #252a36 0%, var(--bg) 60%);
        color: var(--ink);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
      }
      .wrap { display: grid; gap: 18px; justify-items: center; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px;
        display: grid; place-items: center;
        background: #3d4a86; color: var(--ink);
        font: 32px/1 Georgia, serif;
        box-shadow: 0 12px 40px rgba(61, 74, 134, .35);
      }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.18);
        border-top-color: var(--accent);
        animation: spin .8s linear infinite;
      }
      .title { font-size: 15px; letter-spacing: .08em; }
      .hint { font-size: 12px; color: var(--muted); }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">Ω</div>
      <div class="spinner"></div>
      <div class="title">OMNIHARNESS</div>
      <div class="hint">正在启动本地 Harness…</div>
    </div>
  </body>
</html>
